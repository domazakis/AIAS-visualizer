<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ΑΙΑΣ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ΑΙΑΣ</title>
<style>
  :root{ --amber:#ffb63f; --dim:#7d6a55; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8dcc9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(20px,4vh,38px);
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
    overflow:hidden;
  }

  /* Η ίδια αχνή θέρμη που έχουν και τα visualizations πίσω από τη σφαίρα */
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 55% at 50% 46%, rgba(255,140,40,.085), rgba(255,110,20,0) 70%);
  }
  #mark,#pick,#foot{position:relative;z-index:1}

  #mark{
    text-align:center;font-size:clamp(11px,2.6vw,14px);letter-spacing:.55em;
    color:var(--amber);text-transform:uppercase;margin-left:.55em;font-weight:600;
    text-shadow:0 0 26px rgba(255,150,50,.45);
  }
  #mark small{
    display:block;margin-top:9px;margin-left:-.3em;
    font-size:10px;letter-spacing:.28em;color:var(--dim);font-weight:400;
  }

  #pick{
    display:grid;gap:clamp(14px,3vw,26px);width:min(760px,94vw);
    grid-template-columns:repeat(2,1fr);
  }
  @media (max-width:520px), (orientation:portrait){
    #pick{grid-template-columns:1fr}
  }

  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vh,18px);
    padding:clamp(18px,3.4vh,32px) 16px;
    border:1px solid rgba(255,150,50,.26);border-radius:20px;
    background:rgba(255,140,40,.045);
    color:#f0e2cd;text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .card:active{background:rgba(255,140,40,.16);transform:scale(.985)}
  .card:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
  @media (hover:hover){ .card:hover{background:rgba(255,140,40,.10);border-color:rgba(255,150,50,.5)} }

  .card svg{width:clamp(96px,17vw,150px);height:auto;display:block;
    filter:drop-shadow(0 0 14px rgba(255,140,40,.5))}
  .card b{font-size:clamp(14px,3vw,17px);font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;margin-left:.2em}
  .card span{font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-align:center;
    line-height:1.5;max-width:24ch}

  #foot{display:flex;flex-direction:column;align-items:center;gap:12px}
  .btn{
    border:1px solid rgba(255,150,50,.34);background:transparent;color:#c8b49a;
    font-size:12.5px;letter-spacing:.12em;padding:11px 26px;border-radius:999px;
    cursor:pointer;font-family:inherit;
  }
  .btn:active{background:rgba(255,140,40,.16)}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  #note{font-size:10.5px;color:#5d5040;letter-spacing:.05em;text-align:center;max-width:34ch;line-height:1.6}
</style>
</head>
<body>

<div id="mark">ΑΙΑΣ<small>ΟΠΤΙΚΟΠΟΙΗΣΗ ΦΩΝΗΣ</small></div>

<div id="pick">

  <a class="card" href="bars.html">
    <!-- Η πραγματική σιλουέτα των τελειών: 1.6 / 2.5 / 3.4 / 2.5 / 1.6 διάμετροι -->
    <svg viewBox="0 0 110 80" role="img" aria-label="Πέντε τελείες σε σειρά">
      <g fill="#ffa233">
        <rect x="0"    y="24" width="20" height="32" rx="10"/>
        <rect x="22.4" y="15" width="20" height="50" rx="10"/>
        <rect x="44.8" y="6"  width="20" height="68" rx="10"/>
        <rect x="67.2" y="15" width="20" height="50" rx="10"/>
        <rect x="89.6" y="24" width="20" height="32" rx="10"/>
      </g>
    </svg>
    <b>Τελείες</b>
    <span>Φουσκώνουν όλες μαζί όταν μιλάει· κύμα όταν ακούει.</span>
  </a>

  <a class="card" href="v4.html">
    <!-- Κορδέλες: λωρίδες φωτός γύρω από κοινό κέντρο -->
    <svg viewBox="0 0 110 80" role="img" aria-label="Κορδέλες γύρω από σφαίρα">
      <g fill="none" stroke="#ffa233" stroke-linecap="round">
        <ellipse cx="55" cy="40" rx="35" ry="19" stroke-width="13" opacity=".92"
                 transform="rotate(-16 55 40)"/>
        <ellipse cx="55" cy="40" rx="33" ry="11" stroke-width="11" opacity=".55"
                 transform="rotate(52 55 40)"/>
        <ellipse cx="55" cy="40" rx="30" ry="24" stroke-width="8"  opacity=".30"
                 transform="rotate(-72 55 40)"/>
      </g>
      <circle cx="55" cy="40" r="7" fill="#ffe0b8" opacity=".9"/>
    </svg>
    <b>Κορδέλες</b>
    <span>Φαρδιές λωρίδες υφάσματος γύρω από φωτεινό πυρήνα.</span>
  </a>

</div>

<div id="foot">
  <button class="btn" id="fsBtn">Πλήρης οθόνη</button>
  <p id="note">Χωρίς μικρόφωνο σε αυτή τη φάση. Και τα δύο τρέχουν ένα σενάριο δοκιμής με ελληνική φωνή.</p>
</div>

<script>
(function(){
"use strict";
/* Πλήρης οθόνη με κλείδωμα οριζόντιου — ίδιο μοτίβο με τα visualizations.
   Στην εγκατεστημένη εφαρμογή είναι ήδη πλήρης, οπότε το κουμπί κρύβεται. */
var fs=document.getElementById('fsBtn');
if(matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches
   || navigator.standalone){ fs.style.display='none'; }
fs.addEventListener('click',async function(){
  var el=document.documentElement;
  if(!document.fullscreenElement){
    try{
      await el.requestFullscreen();
      if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(function(){}); }
    }catch(e){}
  }else if(document.exitFullscreen){ document.exitFullscreen(); }
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
