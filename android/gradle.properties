org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Το AGP 8.6.1 δοκιμάστηκε ως το compileSdk 35. Το Play απαιτεί πλέον
# targetSdk 36, και το targetSdk δεν γίνεται να ξεπερνά το compileSdk.
# Η πλατφόρμα 36 είναι εγκατεστημένη· η προειδοποίηση κατασταλμένη ρητά,
# ώστε να μη μετατραπεί σε σφάλμα χωρίς να το προσέξουμε.
android.suppressUnsupportedCompileSdk=36
